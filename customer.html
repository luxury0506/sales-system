<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>客戶別銷售與毛利統計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js 用來畫長條圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100">
  <div class="max-w-6xl mx-auto py-6 px-4 space-y-6">
    <header class="flex items-start justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">客戶別銷售與毛利統計</h1>
        <p class="text-sm text-slate-600 mt-1">
          資料來源：<b>請先在主頁（index.html）上傳銷售檔並完成成本計算</b>，本頁會自動讀取分析結果。
        </p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <a href="index.html" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200">🏠 主頁</a>
        <a href="pl.html" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200">📅 本月損益</a>
        <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-blue-500 text-white cursor-default">📊 客戶別統計</span>
        <a href="cost.html" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200">💹 進貨成本比較</a>
        <a href="product.html" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200">📦 產品別統計</a>
        <a href="category.html" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200">🧩 各類型加總</a>
        <a href="pvc.html" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200">🧮 PVC 成本設定</a>
      </div>
    </header>

    <section class="bg-white shadow rounded-xl p-4 space-y-3">
      <div id="status" class="text-sm text-slate-700"></div>

      <!-- 匯出按鈕 -->
      <div class="flex items-center justify-end gap-2">
        <button
          id="downloadCustomerExcel"
          class="hidden inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white hover:bg-emerald-600"
        >
          匯出客戶統計 Excel
        </button>
      </div>

      <!-- 客戶彙總表 -->
      <div class="overflow-auto max-h-[480px] border rounded-lg">
        <table class="min-w-full text-xs text-left">
          <thead class="bg-slate-50 sticky top-0">
            <tr>
              <th class="border px-2 py-1">客戶</th>
              <th class="border px-2 py-1 text-right">總銷貨量</th>
              <th class="border px-2 py-1 text-right">總米數</th>
              <th class="border px-2 py-1 text-right">銷售額</th>
              <th class="border px-2 py-1 text-right">銷貨成本</th>
              <th class="border px-2 py-1 text-right">銷貨毛利</th>
              <th class="border px-2 py-1 text-right">毛利率</th>
            </tr>
          </thead>
          <tbody id="customerTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- 圖表 -->
    <section class="bg-white shadow rounded-xl p-4 space-y-4">
    <h2 class="text-sm font-semibold text-slate-700">客戶毛利長條圖</h2>

    <div class="flex items-center gap-2 text-xs mb-2">
      <label for="chartLimitSelect" class="text-slate-600">顯示客戶數：</label>
      <select
        id="chartLimitSelect"
        class="border rounded px-2 py-1 text-xs text-slate-700"
      >
        <option value="10">Top 10</option>
        <option value="20">Top 20</option>
        <option value="all">全部</option>
      </select>
    </div>

    <canvas id="profitChart" height="160"></canvas>

    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="customer.js"></script>
</body>
</html>
