<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>本月損益總覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100">
  <div class="max-w-4xl mx-auto py-6 px-4 space-y-6">
    <header class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">📅 本月損益總覽</h1>
        <p class="text-sm text-slate-600 mt-1">
          在主頁上傳銷貨明細、算完成本毛利後，按「✅ 記錄這批明細」存起來的每日合計，都會顯示在這裡。<br>
          資料來源：localStorage（跟主頁共用同一份紀錄，不用重新上傳）。
        </p>
      </div>
      <a
        href="index.html"
        class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200"
      >
        回到主頁
      </a>
    </header>

    <section class="bg-white shadow rounded-xl p-5 space-y-4">
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <label class="text-slate-700">檢視月份</label>
        <input id="plMonthSelect" type="month" class="border rounded px-2 py-1 text-sm" />
      </div>

      <div id="plMonthBanner" class="rounded-lg p-4 text-center font-semibold text-lg"></div>

      <div class="overflow-auto">
        <table class="min-w-full text-xs text-left border">
          <thead class="bg-slate-50">
            <tr>
              <th class="border px-2 py-1">日期</th>
              <th class="border px-2 py-1 text-right">銷貨金額</th>
              <th class="border px-2 py-1 text-right">銷貨成本</th>
              <th class="border px-2 py-1 text-right">銷貨毛利</th>
              <th class="border px-2 py-1 text-right">毛利率</th>
              <th class="border px-2 py-1 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="plMonthTbody" class="divide-y"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="pl.js"></script>
</body>
</html>
