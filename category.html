<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>各類型加總金額統計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100">
  <div class="max-w-6xl mx-auto py-6 px-4 space-y-6">
    <header class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">各類型加總金額統計</h1>
        <p class="text-sm text-slate-600 mt-1">
          把物品編號往上收斂到「大分類」（例如 FSG-3、FSG-2、CFT-3、CFT-6、SRG、HST、H…）再加總，
          方便看整個系列的總銷量與毛利，而不是只看到單一規格。<br>
          資料來源：請先在主頁完成計算，本頁會讀取分析結果。
        </p>
      </div>
      <div class="flex gap-2">
        <a
          href="product.html"
          class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100"
        >
          📦 改看細規格明細
        </a>
        <a
          href="index.html"
          class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200"
        >
          回到主頁
        </a>
      </div>
    </header>

    <section class="bg-white shadow rounded-xl p-4 space-y-3">
      <div id="status" class="text-sm text-slate-700"></div>

      <div class="flex items-center justify-end gap-2">
        <button
          id="downloadCategoryExcel"
          class="hidden inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white hover:bg-emerald-600"
        >
          匯出分類加總 Excel
        </button>
      </div>

      <div class="overflow-auto max-h-[480px] border rounded-lg">
        <table class="min-w-full text-xs text-left">
          <thead class="bg-slate-50 sticky top-0">
            <tr>
              <th class="border px-2 py-1">分類</th>
              <th class="border px-2 py-1 text-right">涵蓋編號數</th>
              <th class="border px-2 py-1">涵蓋物品編號參考</th>
              <th class="border px-2 py-1 text-right">總計數量</th>
              <th class="border px-2 py-1 text-right">總計米數</th>
              <th class="border px-2 py-1 text-right">銷售總額</th>
              <th class="border px-2 py-1 text-right">銷貨成本</th>
              <th class="border px-2 py-1 text-right">總毛利</th>
              <th class="border px-2 py-1 text-right">毛利率</th>
            </tr>
          </thead>
          <tbody id="categoryTbody"></tbody>
        </table>
      </div>
    </section>

    <section class="bg-white shadow rounded-xl p-4 space-y-4">
      <h2 class="text-sm font-semibold text-slate-700">分類銷售額排行榜</h2>

      <div class="flex items-center gap-2 text-xs mb-2">
        <label for="chartLimitSelect" class="text-slate-600">顯示分類數：</label>
        <select
          id="chartLimitSelect"
          class="border rounded px-2 py-1 text-xs text-slate-700"
        >
          <option value="10">Top 10</option>
          <option value="20">Top 20</option>
          <option value="all">全部</option>
        </select>
      </div>

      <canvas id="categoryAmountChart" height="160"></canvas>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="category.js"></script>
</body>
</html>
